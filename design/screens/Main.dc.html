<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duet Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0e0f14;color:#f1f2f7;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <div style="position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(180deg,#1f2a14 0%,#0e0f14 100%);opacity:.7"></div>

  <div style="position:relative;padding:56px 16px 0 16px;display:flex;flex-direction:column;gap:20px">

    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:36px;height:36px;border-radius:18px;background:#ff8a4c;color:#0e0f14;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">P</div>
      <div style="display:flex;gap:8px;flex:1;overflow:hidden">
        <div style="padding:8px 16px;border-radius:20px;background:{{accent}};color:#0e0f14;font-weight:700;font-size:14px">All</div>
        <div style="padding:8px 14px;border-radius:20px;background:#1c1e27;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:4px;background:#3ecf7a"></span>Spotify</div>
        <div style="padding:8px 14px;border-radius:20px;background:#1c1e27;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap"><span style="width:8px;height:8px;border-radius:4px;background:#ff6b6b"></span>YT Music</div>
      </div>
      <button aria-label="Settings" style="width:40px;height:40px;border-radius:20px;border:0;background:#1c1e27;color:#f1f2f7;display:flex;align-items:center;justify-content:center;flex:none">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <div style="display:flex;align-items:center;gap:10px;height:52px;border-radius:8px;background:#1c1e27;overflow:hidden">
          <div style="width:52px;height:52px;flex:none;background:{{t.art}}"></div>
          <div style="font-weight:700;font-size:13px;line-height:1.2;padding-right:8px">{{t.name}}</div>
        </div>
      </sc-for>
    </div>

    <div>
      <div style="font-size:20px;font-weight:800;margin-bottom:12px">Your top mixes</div>
      <div style="display:flex;gap:12px;overflow:hidden">
        <sc-for list="{{mixes}}" as="m" hint-placeholder-count="3">
          <div style="width:128px;flex:none">
            <div style="width:128px;height:128px;border-radius:10px;background:{{m.art}};position:relative">
              <span style="position:absolute;left:8px;bottom:8px;font-weight:800;font-size:15px;color:#0e0f14;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:4px">{{m.badge}}</span>
            </div>
            <div style="font-weight:700;font-size:14px;margin-top:8px">{{m.name}}</div>
            <div style="font-size:12px;color:#9aa0b4;display:flex;align-items:center;gap:6px;margin-top:2px"><span style="width:6px;height:6px;border-radius:3px;background:{{m.dot}}"></span>{{m.sub}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:20px;font-weight:800">Quick picks</div>
        <div style="padding:6px 14px;border:1px solid #3a3e50;border-radius:18px;font-weight:600;font-size:13px">Play all</div>
      </div>
      <sc-for list="{{picks}}" as="p" hint-placeholder-count="2">
        <div style="display:flex;align-items:center;gap:12px;padding:6px 0">
          <div style="width:48px;height:48px;border-radius:6px;flex:none;background:{{p.art}}"></div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.title}}</div>
            <div style="font-size:13px;color:#9aa0b4;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:3px;background:{{p.dot}};flex:none"></span>{{p.sub}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(180deg,rgba(14,15,20,0) 0%,#0e0f14 55%)"></div>

  <div style="position:absolute;left:8px;right:8px;bottom:84px;height:58px;border-radius:14px;background:#2a2113;display:flex;align-items:center;gap:12px;padding:0 12px 0 8px;overflow:hidden">
    <div style="width:42px;height:42px;border-radius:6px;background:linear-gradient(135deg,#ff5a2c,#3a0f08);flex:none"></div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Night Signal</div>
      <div style="font-size:12px;color:#c9b99a;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:3px;background:#ff6b6b"></span>YouTube Music · Earbuds</div>
    </div>
    <button aria-label="Add to library" style="width:36px;height:36px;border-radius:18px;border:1.5px solid #f1f2f7;background:none;color:#f1f2f7;display:flex;align-items:center;justify-content:center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button aria-label="Pause" style="width:36px;height:36px;border:0;background:none;color:#f1f2f7;display:flex;align-items:center;justify-content:center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <div style="position:absolute;left:8px;right:8px;bottom:0;height:3px;background:#4a3f2a"><div style="width:42%;height:3px;background:{{accent}}"></div></div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:76px;display:flex;align-items:flex-start;justify-content:space-around;padding:8px 24px 0 24px;background:#0e0f14">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;color:#f1f2f7;font-size:12px;font-weight:700">
      <span style="width:56px;height:30px;border-radius:15px;background:{{accent}};color:#0e0f14;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 11h2v9h5v-6h4v6h5v-9h2z"/></svg></span>Home
    </a>
    <a href="Search.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;color:#9aa0b4;font-size:12px;font-weight:600">
      <span style="width:56px;height:30px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>Search
    </a>
    <a href="Library.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;color:#9aa0b4;font-size:12px;font-weight:600">
      <span style="width:56px;height:30px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M9 4v16"/><path d="m14 5 5 14"/></svg></span>Your Library
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c8f26b","options":["#c8f26b","#8f7bff","#ffb84d","#5ee0d0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = '#3ecf7a', R = '#ff6b6b';
    return {
      accent: this.props.accent ?? '#c8f26b',
      tiles: [
        { name: 'Liked Songs', art: 'linear-gradient(135deg,#5b3df5,#9be3c4)' },
        { name: 'Saved from YT Music', art: 'linear-gradient(135deg,#ff6b6b,#5a1414)' },
        { name: 'Duet mix', art: 'linear-gradient(135deg,#3ecf7a 0%,#3ecf7a 50%,#ff6b6b 50%,#ff6b6b 100%)' },
        { name: 'Recently played', art: 'linear-gradient(135deg,#2c3350,#0f1220)' },
        { name: 'Road trip', art: 'linear-gradient(135deg,#ffb84d,#7a3d0a)' },
        { name: 'Night drive', art: 'linear-gradient(135deg,#243b8a,#0a0f2c)' }
      ],
      mixes: [
        { name: 'Deep Mix', badge: 'Deep', sub: 'Playlist · Spotify', dot: G, art: 'linear-gradient(160deg,#2b2b2b,#b36cff)' },
        { name: 'Late Hours Mix', badge: 'Late', sub: 'Playlist · Spotify', dot: G, art: 'linear-gradient(160deg,#17353a,#b9f0cf)' },
        { name: 'Daylight Mix', badge: 'Day', sub: 'Mix · YouTube Music', dot: R, art: 'linear-gradient(160deg,#7aa7d9,#f4a6c8)' }
      ],
      picks: [
        { title: 'Night Signal', sub: 'Song · Halcyon Lines · YouTube Music', dot: R, art: 'linear-gradient(135deg,#ff5a2c,#3a0f08)' },
        { title: 'Glass Houses', sub: 'Song · Nightbloom · Spotify', dot: G, art: 'linear-gradient(135deg,#4a7bd1,#0d1a38)' },
        { title: 'Paper Planes', sub: 'Song · Velvet Static · Spotify', dot: G, art: 'linear-gradient(135deg,#e8d36b,#4a3d0a)' }
      ]
    };
  }
}
</script>
</body>
</html>
