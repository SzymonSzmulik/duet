<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duet Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0e0f14;color:#f1f2f7;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
<div style="position:relative;padding:56px 16px 0 16px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:30px;font-weight:800">Your Library</div>
    <div style="display:flex;gap:8px">
      <button aria-label="Search library" style="width:40px;height:40px;border-radius:20px;border:0;background:#1c1e27;color:#f1f2f7;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
      <button aria-label="New playlist" style="width:40px;height:40px;border-radius:20px;border:0;background:#1c1e27;color:#f1f2f7;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
  <div style="display:flex;gap:8px;overflow:hidden">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <div style="padding:8px 16px;border-radius:20px;font-weight:700;font-size:14px;white-space:nowrap;background:{{f.bg}};color:{{f.fg}}">{{f.name}}</div>
    </sc-for>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;color:#b4b9cc;font-size:13px;font-weight:600">
    <div style="display:flex;align-items:center;gap:6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>Recents</div>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
  </div>
  <div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div style="display:flex;align-items:center;gap:12px;padding:7px 0">
        <div style="width:56px;height:56px;flex:none;background:{{r.art}};border-radius:{{r.radius}}"></div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}}</div>
          <div style="font-size:13px;color:#9aa0b4;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden"><span style="width:6px;height:6px;border-radius:3px;background:{{r.dot}};flex:none"></span>{{r.sub}}</div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(180deg,rgba(14,15,20,0) 0%,#0e0f14 55%)"></div>
<a href="NowPlaying.dc.html" style="position:absolute;left:8px;right:8px;bottom:84px;height:58px;border-radius:14px;background:#2a2113;display:flex;align-items:center;gap:12px;padding:0 12px 0 8px;overflow:hidden;color:#f1f2f7">
<div style="width:42px;height:42px;border-radius:6px;background:linear-gradient(135deg,#ff5a2c,#3a0f08);flex:none"></div>
<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">Night Signal</div><div style="font-size:12px;color:#c9b99a;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:3px;background:#ff6b6b"></span>YouTube Music · Earbuds</div></div>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
<div style="position:absolute;left:8px;right:8px;bottom:0;height:3px;background:#4a3f2a"><div style="width:42%;height:3px;background:{{accent}}"></div></div>
</a>
<div style="position:absolute;left:0;right:0;bottom:0;height:76px;display:flex;align-items:flex-start;justify-content:space-around;padding:8px 24px 0 24px;background:#0e0f14">
<a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;color:#9aa0b4;font-size:12px;font-weight:600"><span style="width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 11h2v9h5v-6h4v6h5v-9h2z"/></svg></span>Home</a>
<a href="Search.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;color:#9aa0b4;font-size:12px;font-weight:600"><span style="width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>Search</a>
<a href="Library.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;color:#f1f2f7;font-size:12px;font-weight:700"><span style="width:56px;height:30px;border-radius:15px;background:{{accent}};color:#0e0f14;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M9 4v16"/><path d="m14 5 5 14"/></svg></span>Your Library</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c8f26b","options":["#c8f26b","#8f7bff","#ffb84d","#5ee0d0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = '#3ecf7a', R = '#ff6b6b';
    return {
      accent: this.props.accent ?? '#c8f26b',
      filters: [
        { name: 'All', bg: this.props.accent ?? '#c8f26b', fg: '#0e0f14' },
        { name: 'Playlists', bg: '#1c1e27', fg: '#f1f2f7' },
        { name: 'Albums', bg: '#1c1e27', fg: '#f1f2f7' },
        { name: 'Artists', bg: '#1c1e27', fg: '#f1f2f7' }
      ],
      rows: [
        { title: 'Liked Songs', sub: 'Playlist · 312 songs · Spotify', dot: G, art: 'linear-gradient(135deg,#5b3df5,#9be3c4)', radius: '8px' },
        { title: 'Saved from YT Music', sub: 'Playlist · on this device · YouTube Music', dot: R, art: 'linear-gradient(135deg,#ff6b6b,#5a1414)', radius: '8px' },
        { title: 'Duet mix', sub: 'Playlist · Spotify + YouTube Music', dot: '#c8f26b', art: 'linear-gradient(135deg,#3ecf7a 0%,#3ecf7a 50%,#ff6b6b 50%,#ff6b6b 100%)', radius: '8px' },
        { title: 'Road trip', sub: 'Playlist · Spotify', dot: G, art: 'linear-gradient(135deg,#ffb84d,#7a3d0a)', radius: '8px' },
        { title: 'Night drive', sub: 'Playlist · Spotify', dot: G, art: 'linear-gradient(135deg,#243b8a,#0a0f2c)', radius: '8px' },
        { title: 'Halcyon Lines', sub: 'Artist · Spotify', dot: G, art: 'linear-gradient(135deg,#8a8fa3,#1d2030)', radius: '28px' },
        { title: 'Glass Houses', sub: 'Album · Nightbloom · Spotify', dot: G, art: 'linear-gradient(135deg,#4a7bd1,#0d1a38)', radius: '8px' }
      ]
    };
  }
}
</script>
</body>
</html>
